<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>위닝에듀</title>

    <link rel="preload" as="image" href="/images/winning-logo-stacked.svg" fetchpriority="high" />
    <!-- Pretendard Variable dynamic-subset 92조각 중 유일하게 전 페이지 확정 사용되는 조각
         (Basic Latin 전체 + 한국어 최빈 음절 13자). SPA라 @font-face 매칭이 React 렌더 이후로
         밀리므로 이 preload로 폰트 요청 시작점을 문서 파싱 시점까지 앞당긴다.
         crossorigin 필수 — 없으면 동일 출처에서도 CORS 모드 불일치로 이중 다운로드된다. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard-1.3.9/PretendardVariable.subset.91.woff2"
    />

    <style>
      html,
      body,
      #root {
        margin: 0;
        /* src/index.css body 규칙과 동일한 이유 — 320px 뷰포트에서 세로 스크롤바만큼
           줄어든 실제 가용폭(100%)이 고정 320px보다 좁아져 가로 스크롤이 생긴다.
           html 요소는 이 인라인 스타일에서만 min-width가 걸려 있어 src/index.css의
           body 수정만으로는 해결되지 않았다. */
        min-width: min(320px, 100%);
        min-height: 100%;
        background: #ffffff;
      }

      body {
        /* src/index.css body 규칙과 값을 바이트 단위로 동일하게 유지한다.
           'Pretendard'(정적명)가 아니라 'Pretendard Variable'인 이유는
           src/index.css의 동일 주석 참고 — 이름이 다르면 웹폰트가 매칭되지 않는다. */
        font-family:
          'Pretendard Variable',
          'Noto Sans KR',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        overflow-x: hidden;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      #pre-header {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 40;
        width: 100%;
        height: 4rem;
        border-bottom: 1px solid rgba(13, 27, 42, 0.1);
        background: #ffffff;
        box-shadow: 0 8px 28px rgba(13, 27, 42, 0.08);
      }

      .pre-header-inner {
        /* 실헤더(Header.jsx)의 좌표계 1(로고+계정 그룹)과 동일하게 max-w-[120rem](1920px)
           밴드를 기준으로 로고를 좌측 끝에 배치한다. nav는 실헤더에서 별도의 1200px
           컨텐츠 좌표계로 분리됐으므로 프리헤더는 로고 위치만 재현하면 된다. */
        width: 100%;
        max-width: 120rem;
        height: 4rem;
        margin: 0 auto;
        padding: 0 32px;
        display: flex;
        align-items: center;
      }

      .pre-logo-link {
        display: flex;
        width: 65px;
        height: 4rem;
        align-items: center;
        flex-shrink: 0;
      }

      .pre-logo {
        display: block;
        width: 65px;
        height: 2.1875rem;
        object-fit: contain;
      }

      /* Header.jsx의 로고는 모든 뷰포트에서 동일한 h-[2.1875rem](35px, 0729 시안) 고정
         크기이므로 프리헤더 로고 치수도 브레이크포인트 구분 없이 동일하게 유지해
         하이드레이션 시 로고 크기 점프가 생기지 않게 한다. */
      @media (max-width: 900px) {
        #pre-header {
          height: 76px;
        }

        .pre-header-inner {
          height: 76px;
          padding: 0 20px;
        }

        .pre-logo-link {
          width: 65px;
          height: 76px;
        }
      }
    </style>
  </head>

  <body>
    <div id="pre-header" aria-hidden="true">
      <div class="pre-header-inner">
        <div class="pre-logo-link">
          <img
            class="pre-logo"
            src="/images/winning-logo-stacked.svg"
            alt=""
            width="65"
            height="35"
          />
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
