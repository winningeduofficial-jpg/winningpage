<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>위닝에듀</title>

    <link
      rel="preload"
      as="image"
      href="/images/winning-logo-stacked.svg"
      fetchpriority="high"
    />

    <style>
      html,
      body,
      #root {
        margin: 0;
        /* src/index.css body 규칙과 동일한 이유 — 320px 뷰포트에서 세로 스크롤바만큼
           줄어든 실제 가용폭(100%)이 고정 320px보다 좁아져 가로 스크롤이 생긴다.
           html 요소는 이 인라인 스타일에서만 min-width가 걸려 있어 src/index.css의
           body 수정만으로는 해결되지 않았다. */
        min-width: min(320px, 100%);
        min-height: 100%;
        background: #ffffff;
      }

      body {
        font-family:
          Pretendard,
          "Noto Sans KR",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        overflow-x: hidden;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      #pre-header {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 40;
        width: 100%;
        height: 4.25rem;
        border-bottom: 1px solid rgba(13, 27, 42, 0.1);
        background: #ffffff;
        box-shadow: 0 8px 28px rgba(13, 27, 42, 0.08);
      }

      .pre-header-inner {
        /* 실헤더(Header.jsx)의 좌표계 1(로고+계정 그룹)과 동일하게 max-w-[120rem](1920px)
           밴드를 기준으로 로고를 좌측 끝에 배치한다. nav는 실헤더에서 별도의 1200px
           컨텐츠 좌표계로 분리됐으므로 프리헤더는 로고 위치만 재현하면 된다. */
        width: 100%;
        max-width: 120rem;
        height: 4.25rem;
        margin: 0 auto;
        padding: 0 32px;
        display: flex;
        align-items: center;
      }

      .pre-logo-link {
        display: flex;
        width: 74px;
        height: 4.25rem;
        align-items: center;
        flex-shrink: 0;
      }

      .pre-logo {
        display: block;
        width: 74px;
        height: 2.5rem;
        object-fit: contain;
      }

      /* Header.jsx의 로고는 모든 뷰포트에서 동일한 h-[2.5rem] 고정 크기이므로
         프리헤더 로고 치수도 브레이크포인트 구분 없이 동일하게 유지해
         하이드레이션 시 로고 크기 점프가 생기지 않게 한다. */
      @media (max-width: 900px) {
        #pre-header {
          height: 76px;
        }

        .pre-header-inner {
          height: 76px;
          padding: 0 20px;
        }

        .pre-logo-link {
          width: 74px;
          height: 76px;
        }
      }
    </style>
  </head>

  <body>
    <div id="pre-header" aria-hidden="true">
      <div class="pre-header-inner">
        <div class="pre-logo-link">
          <img
            class="pre-logo"
            src="/images/winning-logo-stacked.svg"
            alt=""
            width="74"
            height="40"
          />
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
