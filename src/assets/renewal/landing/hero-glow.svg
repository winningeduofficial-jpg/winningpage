<!-- 시안 3091:4717 (`05 - Poseidon's Realm`, 1600×1200 독립 프레임) 실측:
     Eclipse ELLIPSE 820×820 @ (390,254), 중심(800,664), LAYER_BLUR 200
     Planet  ELLIPSE 232×232 @ (259,658), 중심(375,774), LAYER_BLUR 80
     블러 포함 실제 점유 범위: Eclipse x 190~1410 / y 54~1274, Planet x 179~571 / y 578~970.
     viewBox를 0 0 1600 1200 그대로 두면 Eclipse 블러 하단 74px이 잘려 회전 시 각도에
     따라 직선 크롭 경계가 드러난다. 그래서 viewBox를 "0 -200 1600 1600"으로 정사각
     언클립했다 — 중심이 (800,600)으로 Figma 회전 피벗과 일치하고, y −200~1400 범위가
     Eclipse(54~1274)·Planet(578~970)을 모두 여유 있게 포함한다. 도형·그라디언트·필터
     좌표는 뷰박스 이동과 무관하므로 그대로 유지한다(필터 region도 objectBoundingBox
     기준 %라 이미 블러 확장분을 충분히 커버 — 별도 조정 불요). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -200 1600 1600" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="heroGlowEclipse" x1="800" y1="254" x2="800" y2="1074" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B84FD" stop-opacity="0.4" />
      <stop offset="1" stop-color="#1170FF" stop-opacity="0.46" />
    </linearGradient>
    <filter id="heroGlowEclipseBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
    <linearGradient id="heroGlowPlanet" x1="375" y1="658" x2="375" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7D40FF" stop-opacity="1" />
      <stop offset="1" stop-color="#F58A25" stop-opacity="0" />
    </linearGradient>
    <filter id="heroGlowPlanetBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- 흰 배경 rect 제거: 그레인(overlay) 2장이 회전 래퍼 밖(JSX)으로 되돌아가면서
       더 이상 이 SVG의 stacking context 안에서 backdrop이 필요 없다. -->
  <circle cx="800" cy="664" r="410" fill="url(#heroGlowEclipse)" filter="url(#heroGlowEclipseBlur)" />
  <circle cx="375" cy="774" r="116" fill="url(#heroGlowPlanet)" filter="url(#heroGlowPlanetBlur)" />
</svg>
