# 마이그레이션 리허설 CI — PR에 supabase/ 변경이 있으면 로컬 Docker 스택에
# 전체 재생(baseline부터 seed까지)을 돌려본다.
#
# required check("rehearse-migrations")로 쓰기 위해 모든 PR에서 트리거된다.
# paths 필터를 쓰면 미변경 PR에서 check가 아예 안 떠서 머지가 영구 블록되기 때문.
# supabase/ 변경이 없으면 즉시 성공으로 끝난다.
name: db-migrations-ci

on:
  pull_request:

jobs:
  rehearse-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect supabase/ changes
        id: changes
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD | grep -q '^supabase/'; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
            echo "supabase/ 변경 없음 — 리허설 생략"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.supabase == 'true'
        with:
          version: latest

      - name: Start local database and replay all migrations
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db start

      - name: Reset — migrations + seed full replay
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db reset

      - name: Lint database schema
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db lint --fail-on error
